<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B24 قريبًا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>
:root{--bg:#07060a;--gold:#ffc46b;--warm:#ffe6b0;--ink:#f4efe6;--kufi:'Baloo Bhaijaan 2','Rubik','Segoe UI',Tahoma,sans-serif;--mx:0;--my:0;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
canvas,#light,#cord{position:fixed;inset:0;width:100%;height:100%}
#light{z-index:1;pointer-events:none;opacity:0;transition:opacity .7s ease;background:
 radial-gradient(ellipse 90% 75% at 50% 14%,rgba(255,230,170,.5),rgba(255,196,107,.16) 42%,transparent 72%),
 radial-gradient(circle at 50% 0,rgba(255,244,214,.9),transparent 9%)}
#fx{z-index:3;pointer-events:none}
#logo{position:fixed;z-index:2;left:50%;top:50%;width:min(78vw,430px);transform:translate(-50%,-50%) scale(.9);opacity:0;filter:blur(14px);transition:opacity .9s ease,filter .9s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),top 1.2s cubic-bezier(.2,.8,.2,1)}
body.lit #logo{opacity:1;filter:blur(0) drop-shadow(0 0 26px rgba(255,214,140,.5));transform:translate(-50%,-50%) scale(1)}
body.soon #logo,body.soon.lit #logo{opacity:0;filter:blur(12px)}
#cord{z-index:4;pointer-events:none}
#hit{pointer-events:all;cursor:grab;touch-action:none}
#hint{position:fixed;z-index:5;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);padding:14px 26px;border-radius:999px;font-size:1.05rem;letter-spacing:.02em;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);
 opacity:0;pointer-events:none;transition:opacity .8s ease,transform .8s ease;white-space:nowrap}
#hint.on{opacity:1;transform:translate(-50%,0)}
#soon{position:fixed;z-index:5;left:0;right:0;top:50%;text-align:center;pointer-events:none;transform:translateY(-50%)}
#soon .ar{display:inline-block;font-family:var(--kufi);font-weight:800;font-size:clamp(4.2rem,22vw,9rem);line-height:1.3;color:#fff6e0;clip-path:inset(0 0 0 100%);opacity:0;
 text-shadow:calc(var(--mx)*-10px) calc(var(--my)*-10px) 22px rgba(255,190,100,.75),0 0 60px rgba(255,170,70,.45);
 transform:perspective(700px) rotateY(calc(var(--mx)*12deg)) rotateX(calc(var(--my)*-9deg))}
#soon .en{display:block;font-size:1rem;letter-spacing:.5em;color:var(--gold);opacity:0;transition:opacity 1.4s ease 1.6s;margin-top:-.2em;padding-inline-start:.5em}
body.soon #soon .ar{opacity:1;clip-path:inset(0 0 0 0);transition:clip-path 1.6s cubic-bezier(.6,0,.2,1),opacity .3s}
body.soon #soon .en{opacity:.85}
body:not(.lit) #soon{opacity:0}
#soon{transition:opacity .35s}
#start{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(4vh + env(safe-area-inset-bottom,0px));background:var(--bg);cursor:pointer;transition:opacity .6s}
#start span{font-size:.78rem;letter-spacing:.12em;color:#d9c7a0;display:inline-block;animation:w 2.4s ease-in-out infinite;text-shadow:calc(var(--mx)*-6px) calc(var(--my)*-6px) 10px rgba(255,196,107,.9)}
@keyframes w{0%,100%{opacity:.35;letter-spacing:.12em}50%{opacity:.95;letter-spacing:.22em}}
#start.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){#start span{animation:none}}
</style>
</head>

/* sound */
function tone(f0,f1,d,type='sine',v=.4){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d)}
function boom(){if(!AC)return;const n=AC.sampleRate*1,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(4000,t);f.frequency.exponentialRampToValueAtTime(120,t+.9);g.gain.value=.7;s.connect(f).connect(g).connect(AC.destination);s.start();tone(110,30,.6,'sine',.7)}
const click=()=>{tone(1800,900,.04,'square',.12);tone(200,120,.08,'triangle',.25)};
const thump=v=>tone(160,45,.18,'sine',v);

/* ball + explosion */
const R=()=>Math.min(W,H)*.052+10,FY=()=>H*.6;
function drop(){ball={x:W/2,y:-30,vy:0,hits:0,sq:0}}
function explode(x,y){
 for(let i=0;i<170;i++){const a=rnd(0,6.283),s=rnd(80,560)*(Math.random()<.2?1.5:1);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,r:rnd(1,3.2),l:rnd(.7,1.8),h:rnd(32,52),dust:false,ph:rnd(0,6)})}
 flash=1;boom();ball=null;setTimeout(showCord,900)}
function stepBall(dt){const b=ball,r=R();b.vy+=H*2.3*dt;b.y+=b.vy*dt;b.sq*=Math.pow(.002,dt);
 if(b.y>=FY()-r){b.y=FY()-r;b.hits++;
  if(b.hits>=3){explode(b.x,b.y);return}
  thump(.6/b.hits);b.sq=.5/b.hits;ring.push({x:b.x,t:0});b.vy=-b.vy*(b.hits==1?.7:.6)}
 const k=Math.max(0,(FY()-b.y)/H);
 C.fillStyle=`rgba(255,190,100,${.22-k*.3>0?.22-k*.3:0})`;C.beginPath();C.ellipse(b.x,FY()+4,r*(1.3-k*2),r*.22,0,0,6.283);C.fill();
 C.save();C.translate(b.x,b.y+r);C.scale(1+b.sq*.6,1-b.sq);C.translate(0,-r);
 let g=C.createRadialGradient(-r*.3,-r*.3,1,0,0,r*3);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,214,140,.95)');g.addColorStop(.35,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,150,50,0)');
 C.fillStyle=g;C.beginPath();C.arc(0,0,r*3,0,6.283);C.fill();C.restore()}

/* cord */
function showCord(){state=1;revealing=true}
function upd(dt,t){
 if(revealing&&reveal<1)reveal=Math.min(1,reveal+dt*1.1);
 if(!reveal)return;
 if(!drag){const a=-70*pull-9*pv;pv+=a*dt;pull+=pv*dt;if(Math.abs(pull)<.05&&Math.abs(pv)<.5){pull=0;pv=0}amp*=Math.pow(.5,dt);swx*=Math.pow(.3,dt)}
 const e=1-Math.pow(1-reveal,3),L=H*.2*e,cx=W/2,ey=L+pull,sw=Math.sin(t/1000*1.7)*(state==1?7:4)*e+swx+Math.sin(t/1000*3)*amp*pull*.03;
 rope.setAttribute('d',`M${cx} -4 Q${cx+sw*.4} ${ey*.55} ${cx+sw} ${ey}`);
 bead.setAttribute('cx',cx+sw);bead.setAttribute('cy',ey);hit.setAttribute('cx',cx+sw);hit.setAttribute('cy',ey);
 bead.style.filter=B.classList.contains('lit')?'drop-shadow(0 0 8px #ffc46b)':'none'}
hit.addEventListener('pointerdown',e=>{if(state<1)return;drag=true;fired=false;sy=e.clientY-pull;sx=e.clientX;hit.setPointerCapture(e.pointerId);hit.style.cursor='grabbing'});
hit.addEventListener('pointermove',e=>{if(!drag)return;const raw=Math.max(0,e.clientY-sy);pull=raw<90?raw:90+(raw-90)*.25;pull=Math.min(pull,130);swx=Math.max(-26,Math.min(26,(e.clientX-sx)*.3));
 if(pull>62&&!fired){fired=true;trigger()}});
const up=()=>{if(!drag)return;drag=false;pv=0;amp=1;hit.style.cursor='grab'};
hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);

/* light sequence */
function lit(on){B.classList.toggle('lit',on)}
function trigger(){
 if(busy)return;click();
 if(state==1){state=2;lit(true);tone(90,90,.5,'sawtooth',.05);setTimeout(()=>hint.classList.add('on'),1600)}
 else if(state==2){state=3;busy=true;hint.classList.remove('on');lit(false);
  setTimeout(()=>{lit(true);B.classList.add('soon')},1100);
  setTimeout(()=>lit(false),1260);setTimeout(()=>lit(true),1360);
  setTimeout(()=>{busy=false},3200)}
 else{lit(!B.classList.contains('lit'))}}

/* main loop */
function loop(t){const dt=Math.min((t-last)/1000||.016,.033);last=t;C.clearRect(0,0,W,H);
 if(ball)stepBall(dt);
 for(let i=ring.length-1;i>=0;i--){const q=ring[i];q.t+=dt*1.6;if(q.t>1){ring.splice(i,1);continue}C.strokeStyle=`rgba(255,200,120,${.5*(1-q.t)})`;C.lineWidth=2;C.beginPath();C.ellipse(q.x,FY()+4,R()*(1+q.t*5),R()*.3*(1+q.t*3),0,0,6.283);C.stroke()}
 C.globalCompositeOperation='lighter';
 for(const p of P){
  const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
  if(d2<16900&&d2>1){const d=Math.sqrt(d2),f=(1-d/130)*1400*dt;p.vx+=dx/d*f;p.vy+=dy/d*f}
  p.l-=dt;let a;
  if(!p.dust){p.vx*=Math.pow(.25,dt);p.vy*=Math.pow(.25,dt);p.vy+=260*dt;a=Math.min(1,p.l*1.6);if(p.l<=0){p.dust=true;p.vx*=.2}}
  else{p.vx+=(Math.sin(t/1700+p.ph)*8-p.vx)*dt;p.vy+=(-9-p.vy)*dt*.6;a=.18+.14*Math.sin(t/600+p.ph);if(p.y<-10)p.y=H+10;if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  C.fillStyle=`hsla(${p.h},100%,${p.dust?70:62}%,${Math.max(0,a)})`;C.beginPath();C.arc(p.x,p.y,p.r*(p.dust?1:1+p.l*.3),0,6.283);C.fill()}
 if(flash>0){const g=C.createRadialGradient(W/2,FY(),0,W/2,FY(),Math.max(W,H)*.7);g.addColorStop(0,`rgba(255,240,200,${flash})`);g.addColorStop(1,'rgba(255,170,70,0)');C.fillStyle=g;C.fillRect(0,0,W,H);flash-=dt*2.2}
 C.globalCompositeOperation='source-over';
 upd(dt,t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* pointer interaction */
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;document.documentElement.style.setProperty('--mx',(e.clientX/W*2-1).toFixed(3));document.documentElement.style.setProperty('--my',(e.clientY/H*2-1).toFixed(3))});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){mx=my=-999}});

/* start */
$('start').addEventListener('pointerdown',()=>{
 try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
 $('start').classList.add('off');setTimeout(drop,500)},{once:true});
})();
</script>
</body>
</html>
