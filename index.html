<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B24 قريبًا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@800&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<style>

:root{--bg:#07060a;--gold:#ffc46b;--warm:#ffe6b0;--ink:#f4efe6;--kufi:'Baloo Bhaijaan 2','Rubik','Segoe UI',Tahoma,sans-serif;--mx:0;--my:0;--body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none}
canvas,#light,#cord{position:fixed;inset:0;width:100%;height:100%}
#light{z-index:1;pointer-events:none;opacity:0;transition:opacity .7s ease;background:
 radial-gradient(ellipse 90% 75% at 50% 14%,rgba(255,230,170,.5),rgba(255,196,107,.16) 42%,transparent 72%),
 radial-gradient(circle at 50% 0,rgba(255,244,214,.9),transparent 9%)}
#fx{z-index:3;pointer-events:none}
#logo{position:fixed;z-index:2;left:50%;top:50%;width:min(78vw,430px);transform:translate(-50%,-50%) scale(.9);opacity:0;filter:blur(14px);transition:opacity .9s ease,filter .9s ease,transform 1.2s cubic-bezier(.2,.8,.2,1),top 1.2s cubic-bezier(.2,.8,.2,1)}
body.lit #logo{opacity:1;filter:blur(0) drop-shadow(0 0 26px rgba(255,214,140,.5));transform:translate(-50%,-50%) scale(1)}
body.glass #logo,body.glass.lit #logo,body.soon #logo,body.soon.lit #logo{opacity:0;filter:blur(12px)}
.pg{position:fixed;z-index:2;left:0;right:0;top:21vh;bottom:calc(9vh + 78px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(12px,2.4vh,24px);padding:0 6vw;pointer-events:none;opacity:0;filter:blur(14px);transition:opacity .9s ease,filter .9s ease}
body.lit:not(.soon) .pg.on{opacity:1;filter:none}
.pg .em::before{content:"";position:absolute;inset:-14%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,214,140,.34),rgba(255,190,100,.12) 60%,transparent 75%)}
.pg .em{position:relative;width:min(40vw,250px,25vh);aspect-ratio:var(--ar,720/607);scale:.9;transition:scale 1.3s cubic-bezier(.2,.8,.2,1);
 transform:perspective(800px) rotateY(calc(var(--mx)*5deg)) rotateX(calc(var(--my)*-4deg));animation:fl 6s ease-in-out infinite}
body.lit .pg.on .em{scale:1}
@keyframes fl{50%{translate:0 -7px}}
.pg .em img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.pg .em i{display:none}
.pg .em i.ok{display:block;position:absolute;inset:0;overflow:hidden;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.pg .em i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.7) 50%,transparent 65%);transform:translateX(-120%);animation:sh 6s ease-in-out 1.6s infinite;will-change:transform}
@keyframes sh{0%{transform:translateX(-120%)}55%,100%{transform:translateX(200%)}}
.pg p{margin:0;max-width:88vw;text-align:center;white-space:pre-line;font-family:var(--body);font-weight:500;font-size:clamp(.98rem,4.3vw,1.4rem);line-height:1.8;color:#fff6e0;
 text-shadow:0 0 18px rgba(255,214,140,.55),0 0 42px rgba(255,190,100,.28);opacity:0;transform:translateY(12px);transition:opacity 1.1s ease,transform 1.1s ease}
body.lit .pg.on p{opacity:1;transform:none;transition-delay:.6s}
.pg h2{position:relative;margin:0;padding-bottom:12px;text-align:center;font-family:var(--kufi);font-weight:800;font-size:clamp(1.35rem,6.4vw,2.1rem);line-height:1.3;color:#fff6e0;letter-spacing:.01em;
 text-shadow:0 0 18px rgba(255,214,140,.7),0 0 44px rgba(255,190,100,.38);opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.1s ease}
.pg h2::after{content:"";position:absolute;left:50%;bottom:0;width:64px;height:2px;margin-left:-32px;border-radius:2px;background:linear-gradient(90deg,transparent,#ffd27a,transparent);box-shadow:0 0 12px rgba(255,200,110,.8)}
body.lit .pg.on h2{opacity:1;transform:none;transition-delay:.35s}
.pg .cta{position:relative;overflow:hidden;margin:0;max-width:min(88vw,520px);padding:14px 22px;border-radius:14px;text-align:center;white-space:pre-line;font-family:var(--body);font-weight:500;font-size:clamp(.92rem,4vw,1.2rem);line-height:1.75;color:#fff1cf;
 background:linear-gradient(135deg,rgba(255,214,140,.24),rgba(255,160,60,.07));border:1.5px solid rgba(255,208,125,.95);
 box-shadow:0 0 22px rgba(255,190,100,.42),0 0 60px rgba(255,170,70,.18),inset 0 0 18px rgba(255,214,140,.18),inset 0 1px 0 rgba(255,255,255,.4);
 text-shadow:0 0 12px rgba(255,200,110,.6);opacity:0;transform:translateY(12px) scale(.97);transition:opacity 1.1s ease,transform 1.1s ease}
.pg .cta::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 42%,rgba(255,240,200,.35) 50%,transparent 58%) 0% 0/300% 100% no-repeat;animation:sh2 6s ease-in-out 2.4s infinite;pointer-events:none}
@keyframes sh2{0%{background-position:0% 0}55%,100%{background-position:100% 0}}
body.lit .pg.on .cta{opacity:1;transform:none;transition-delay:1.3s}
.pg>*{flex-shrink:0}
@media (max-height:700px){.pg{top:17vh}.pg .em{width:min(40vw,22vh)}.pg p{font-size:.9rem;line-height:1.65}.pg .cta{font-size:.86rem;padding:10px 16px;line-height:1.6}.pg h2{font-size:1.2rem;padding-bottom:8px}}
#cord{z-index:4;pointer-events:none}
#hit{pointer-events:all;cursor:grab;touch-action:none}
#hint{position:fixed;z-index:5;left:50%;bottom:calc(9vh + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);padding:14px 26px;border-radius:999px;font-size:1.05rem;letter-spacing:.02em;
 background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);
 opacity:0;pointer-events:none;transition:opacity .8s ease,transform .8s ease;white-space:nowrap}
#hint.on{opacity:1;transform:translate(-50%,0)}
#soon{position:fixed;z-index:5;left:0;right:0;top:50%;text-align:center;pointer-events:none;transform:translateY(-50%)}
#soon .ar{display:inline-block;font-family:var(--kufi);font-weight:800;font-size:clamp(4.2rem,22vw,9rem);line-height:1.3;color:#fff6e0;clip-path:inset(-120px -120px -120px 100%);opacity:0;
 text-shadow:calc(var(--mx)*-3px) calc(var(--my)*-3px) 22px rgba(255,190,100,.75),0 0 60px rgba(255,170,70,.45);
 transform:perspective(700px) rotateY(calc(var(--mx)*5deg)) rotateX(calc(var(--my)*-3deg))}
#soon .en{display:block;font-size:1rem;letter-spacing:.5em;color:var(--gold);opacity:0;transition:opacity 1.4s ease 1.6s;margin-top:-.2em;padding-inline-start:.5em}
body.soon #soon .ar{opacity:1;clip-path:inset(-120px -120px -120px -120px);transition:clip-path 1.6s cubic-bezier(.6,0,.2,1),opacity .3s}
body.soon #soon .en{opacity:.85}
body:not(.lit) #soon{opacity:0}
#soon{transition:opacity .35s}
#start{position:fixed;inset:0;z-index:9;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(4vh + env(safe-area-inset-bottom,0px));background:var(--bg);cursor:pointer;transition:opacity .6s}
#start span{font-size:.78rem;letter-spacing:.12em;color:#d9c7a0;display:inline-block;animation:w 2.4s ease-in-out infinite;text-shadow:calc(var(--mx)*-6px) calc(var(--my)*-6px) 10px rgba(255,196,107,.9)}
@keyframes w{0%,100%{opacity:.35;letter-spacing:.12em}50%{opacity:.95;letter-spacing:.22em}}
#start.off{opacity:0;pointer-events:none}
#mute{position:fixed;z-index:10;top:calc(14px + env(safe-area-inset-top,0px));left:14px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding:0;color:#f4e6c8;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);opacity:0;pointer-events:none;transition:opacity .8s ease .6s}
body.started #mute{opacity:.8;pointer-events:auto}
#mute .sl{display:none}#mute.off .sl{display:block}#mute.off .w{display:none}
@media (prefers-reduced-motion:reduce){#start span{animation:none}}
#glass2{--ar:520/717}
.pg.p2 .em{width:min(25vw,150px,13vh)}
.pg.p2 p{font-size:clamp(.9rem,3.9vw,1.25rem);line-height:1.75}
.pg.p2 .cta{font-size:clamp(.86rem,3.7vw,1.1rem);line-height:1.7}
@media (max-height:700px){.pg.p2 .em{width:min(22vw,11vh)}.pg.p2 p{font-size:.82rem;line-height:1.55}.pg.p2 .cta{font-size:.8rem;padding:8px 14px;line-height:1.5}.pg.p2{top:15vh}}
</style>
</head>

/* النص داخل المستطيل الذهبي */

/* ===== صفحة الهندسة الكهربائية ===== */

تذكر دائماً أن العالم بدون عقولكم يغرق في الصمت والظلام، فاستمروا في إبقاء كوكبنا مضيئاً ونابضاً!`;
const PAGE_CTA2 = `نحن نضع الخطوط العريضة لمشروعٍ يُطبخ في الخفاء؛ فانضم إلى أسرة 24 لنبني صرح التقدم والإبداع، ونُطلق شرارة ما هو قادم`;

<script>
(()=>{

/* sound */
function tone(f0,f1,d,type='sine',v=.4){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(OUT);o.start(t);o.stop(t+d)}
function boom(){if(!AC)return;const n=AC.sampleRate*1,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain(),t=AC.currentTime;s.buffer=b;f.type='lowpass';f.frequency.setValueAtTime(4000,t);f.frequency.exponentialRampToValueAtTime(120,t+.9);g.gain.value=.7;s.connect(f).connect(g).connect(OUT);s.start();tone(110,30,.6,'sine',.7)}
const click=()=>{tone(1800,900,.04,'square',.12);tone(200,120,.08,'triangle',.25)};
const thump=v=>tone(160,45,.18,'sine',v);


/* music: generative ambient, low volume */
let OUT;
const MU={on:0,muted:false,stage:0,ci:0,nc:0,nn:0,np:0,lvl:.13};
const mf=m=>440*Math.pow(2,(m-69)/12);
const SETS={
 0:[[50,57,62,65],[46,53,58,62],[43,50,55,58],[45,52,57,60]],
 2:[[46,53,57,62],[48,55,59,64],[50,57,60,65],[45,52,55,60]],

function musicInit(){

 MU.pf=x.createBiquadFilter();MU.pf.type='lowpass';MU.pf.frequency.value=CUT[0];MU.pf.Q.value=.6;
 const pg=x.createGain();pg.gain.value=.22;MU.pf.connect(pg);pg.connect(MU.m);
 const lfo=x.createOscillator(),lg=x.createGain();lfo.frequency.value=.09;lg.gain.value=160;lfo.connect(lg);lg.connect(MU.pf.frequency);lfo.start();
 MU.v=[];for(let i=0;i<4;i++){const vs=[];for(const dt of[-7,7]){const o=x.createOscillator(),g=x.createGain();o.type='triangle';o.detune.value=dt;g.gain.value=.5;o.frequency.value=mf(SETS[0][0][i]);o.connect(g);g.connect(MU.pf);o.start();vs.push(o)}MU.v.push(vs)}
 MU.dg=x.createGain();MU.dg.gain.value=DRN[0]*.5;MU.dg.connect(MU.m);
 for(const[m,ty]of[[38,'sine'],[45,'sine'],[50,'triangle']]){const o=x.createOscillator(),g=x.createGain();o.type=ty;o.frequency.value=mf(m);g.gain.value=ty=='triangle'?.12:.5;o.connect(g);g.connect(MU.dg);o.start()}
 MU.nc=MU.nn=MU.np=x.currentTime+6;MU.nn=MU.np=x.currentTime+.3;MU.on=1;setInterval(musicTick,120)}
function chordTo(t){const c=setFor(MU.stage)[MU.ci%4];MU.v.forEach((vs,i)=>vs.forEach(o=>o.frequency.setTargetAtTime(mf(c[i]),t,.9)))}
function pluck(t){const c=setFor(MU.stage)[MU.ci%4],m=c[Math.floor(Math.random()*4)]+(MU.stage==4||Math.random()<.5?24:12),x=AC,g=x.createGain(),o=x.createOscillator(),o2=x.createOscillator(),g2=x.createGain();
 o.type='sine';o2.type='triangle';o.frequency.value=mf(m);o2.frequency.value=mf(m)*2;g2.gain.value=.15;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.38,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+1.8);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(MU.m);g.connect(MU.dl);o.start(t);o2.start(t);o.stop(t+1.9);o2.stop(t+1.9)}
function pulse(t){const x=AC,o=x.createOscillator(),g=x.createGain();o.frequency.setValueAtTime(95,t);o.frequency.exponentialRampToValueAtTime(48,t+.22);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(MU.m);o.start(t);o.stop(t+.35)}
function musicTick(){if(!MU.on||AC.state!=='running')return;const now=AC.currentTime;
 if(MU.nn<now-1)MU.nn=now;if(MU.np<now-1)MU.np=now;
 if(now>=MU.nc){MU.ci++;chordTo(now);MU.nc=now+6}
 while(MU.nn<now+.3){if(Math.random()<ARP[MU.stage])pluck(MU.nn);MU.nn+=.5}
 if(MU.stage==0)while(MU.np<now+.3){pulse(MU.np);MU.np+=1}}
function mStage(st){if(!MU.on)return;const t=AC.currentTime;MU.stage=st;MU.pf.frequency.setTargetAtTime(CUT[st],t,1.2);MU.dg.gain.setTargetAtTime(DRN[st]*.5,t,1.5);MU.ci=0;chordTo(t);MU.nc=t+6}
function mDip(d){if(!MU.on)return;const g=MU.m.gain,t=AC.currentTime;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);g.linearRampToValueAtTime(MU.lvl*.1,t+.25);g.setTargetAtTime(MU.lvl,t+d,.6)}
function setMute(m){MU.muted=m;if(OUT)OUT.gain.setTargetAtTime(m?0:1,AC.currentTime,.12);$('mute').classList.toggle('off',m);try{localStorage.setItem('b24mute',m?'1':'0')}catch(e){}}
$('mute').addEventListener('click',()=>setMute(!MU.muted));
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});

/* ball + explosion */
const R=()=>Math.min(W,H)*.052+10,FY=()=>H*.6;
function drop(){ball={x:W/2,y:-30,vy:0,hits:0,sq:0}}
function explode(x,y){
 for(let i=0;i<170;i++){const a=rnd(0,6.283),s=rnd(80,560)*(Math.random()<.2?1.5:1);P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,r:rnd(1,3.2),l:rnd(.7,1.8),h:rnd(32,52),dust:false,ph:rnd(0,6)})}
 flash=1;boom();mStage(1);mDip(1.4);ball=null;setTimeout(showCord,900)}
function stepBall(dt){const b=ball,r=R();b.vy+=H*2.3*dt;b.y+=b.vy*dt;b.sq*=Math.pow(.002,dt);
 if(b.y>=FY()-r){b.y=FY()-r;b.hits++;
  if(b.hits>=3){explode(b.x,b.y);return}
  thump(.6/b.hits);b.sq=.5/b.hits;ring.push({x:b.x,t:0});b.vy=-b.vy*(b.hits==1?.7:.6)}
 const k=Math.max(0,(FY()-b.y)/H);
 C.fillStyle=`rgba(255,190,100,${.22-k*.3>0?.22-k*.3:0})`;C.beginPath();C.ellipse(b.x,FY()+4,r*(1.3-k*2),r*.22,0,0,6.283);C.fill();
 C.save();C.translate(b.x,b.y+r);C.scale(1+b.sq*.6,1-b.sq);C.translate(0,-r);
 let g=C.createRadialGradient(-r*.3,-r*.3,1,0,0,r*3);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,214,140,.95)');g.addColorStop(.35,'rgba(255,170,70,.35)');g.addColorStop(1,'rgba(255,150,50,0)');
 C.fillStyle=g;C.beginPath();C.arc(0,0,r*3,0,6.283);C.fill();C.restore()}

/* cord */
function showCord(){state=1;revealing=true}
function upd(dt,t){
 if(revealing&&reveal<1)reveal=Math.min(1,reveal+dt*1.1);
 if(!reveal)return;
 if(!drag){const a=-70*pull-9*pv;pv+=a*dt;pull+=pv*dt;if(Math.abs(pull)<.05&&Math.abs(pv)<.5){pull=0;pv=0}amp*=Math.pow(.5,dt);swx*=Math.pow(.3,dt)}
 const e=1-Math.pow(1-reveal,3),L=H*.2*e,cx=W/2,ey=L+pull,sw=Math.sin(t/1000*1.7)*(state==1?7:4)*e+swx+Math.sin(t/1000*3)*amp*pull*.03;
 rope.setAttribute('d',`M${cx} -4 Q${cx+sw*.4} ${ey*.55} ${cx+sw} ${ey}`);
 bead.setAttribute('cx',cx+sw);bead.setAttribute('cy',ey);hit.setAttribute('cx',cx+sw);hit.setAttribute('cy',ey);
 bead.style.filter=B.classList.contains('lit')?'drop-shadow(0 0 8px #ffc46b)':'none'}
hit.addEventListener('pointerdown',e=>{if(state<1)return;drag=true;fired=false;sy=e.clientY-pull;sx=e.clientX;hit.setPointerCapture(e.pointerId);hit.style.cursor='grabbing'});
hit.addEventListener('pointermove',e=>{if(!drag)return;const raw=Math.max(0,e.clientY-sy);pull=raw<90?raw:90+(raw-90)*.25;pull=Math.min(pull,130);swx=Math.max(-26,Math.min(26,(e.clientX-sx)*.3));
 if(pull>62&&!fired){fired=true;trigger()}});
const up=()=>{if(!drag)return;drag=false;pv=0;amp=1;hit.style.cursor='grab'};
hit.addEventListener('pointerup',up);hit.addEventListener('pointercancel',up);

/* light sequence */
function lit(on){B.classList.toggle('lit',on)}
function flick(mid){mDip(1.5);lit(false);setTimeout(()=>{lit(true);mid()},1100);setTimeout(()=>lit(false),1260);setTimeout(()=>lit(true),1360)}
function trigger(){
 if(busy)return;click();
 if(state==1){state=2;lit(true);mStage(2);tone(90,90,.5,'sawtooth',.05);setTimeout(()=>hint.classList.add('on'),1600)}
 else if(state==2){state=3;busy=true;hint.classList.remove('on');flick(()=>{B.classList.add('glass');$('glass').classList.add('on');mStage(3)});
  setTimeout(()=>{busy=false},3200);setTimeout(()=>{if(state==3)hint.classList.add('on')},5000)}
 else if(state==3){state=4;busy=true;hint.classList.remove('on');flick(()=>{$('glass').classList.remove('on');$('glass2').classList.add('on');mStage(3)});
  setTimeout(()=>{busy=false},3200);setTimeout(()=>{if(state==4)hint.classList.add('on')},5000)}
 else if(state==4){state=5;busy=true;hint.classList.remove('on');flick(()=>{B.classList.add('soon');$('glass2').classList.remove('on');mStage(4)});
  setTimeout(()=>{busy=false},3200)}
 else{lit(!B.classList.contains('lit'))}}
$('gtitle').textContent=PAGE_TITLE;$('gtext').textContent=PAGE_TEXT;$('gcta').textContent=PAGE_CTA;$('g2title').textContent=PAGE_TITLE2;$('g2text').textContent=PAGE_TEXT2;$('g2cta').textContent=PAGE_CTA2;

/* main loop */
function loop(t){const dt=Math.min((t-last)/1000||.016,.033);last=t;C.clearRect(0,0,W,H);
 if(ball)stepBall(dt);
 for(let i=ring.length-1;i>=0;i--){const q=ring[i];q.t+=dt*1.6;if(q.t>1){ring.splice(i,1);continue}C.strokeStyle=`rgba(255,200,120,${.5*(1-q.t)})`;C.lineWidth=2;C.beginPath();C.ellipse(q.x,FY()+4,R()*(1+q.t*5),R()*.3*(1+q.t*3),0,0,6.283);C.stroke()}
 C.globalCompositeOperation='lighter';
 for(const p of P){
  const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
  if(d2<16900&&d2>1){const d=Math.sqrt(d2),f=(1-d/130)*1400*dt;p.vx+=dx/d*f;p.vy+=dy/d*f}
  p.l-=dt;let a;
  if(!p.dust){p.vx*=Math.pow(.25,dt);p.vy*=Math.pow(.25,dt);p.vy+=260*dt;a=Math.min(1,p.l*1.6);if(p.l<=0){p.dust=true;p.vx*=.2}}
  else{p.vx+=(Math.sin(t/1700+p.ph)*8-p.vx)*dt;p.vy+=(-9-p.vy)*dt*.6;a=.18+.14*Math.sin(t/600+p.ph);if(p.y<-10)p.y=H+10;if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10}
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  C.fillStyle=`hsla(${p.h},100%,${p.dust?70:62}%,${Math.max(0,a)})`;C.beginPath();C.arc(p.x,p.y,p.r*(p.dust?1:1+p.l*.3),0,6.283);C.fill()}
 if(flash>0){const g=C.createRadialGradient(W/2,FY(),0,W/2,FY(),Math.max(W,H)*.7);g.addColorStop(0,`rgba(255,240,200,${flash})`);g.addColorStop(1,'rgba(255,170,70,0)');C.fillStyle=g;C.fillRect(0,0,W,H);flash-=dt*2.2}
 C.globalCompositeOperation='source-over';
 upd(dt,t);requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* pointer interaction */
let pq=0;addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(e.pointerType!=='mouse'||pq)return;pq=1;requestAnimationFrame(()=>{pq=0;const st=document.documentElement.style;st.setProperty('--mx',(mx/W*2-1).toFixed(3));st.setProperty('--my',(my/H*2-1).toFixed(3))})});
addEventListener('pointerup',e=>{if(e.pointerType==='touch'){mx=my=-999}});

/* start */
$('start').addEventListener('pointerdown',()=>{
 try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();OUT=AC.createGain();OUT.connect(AC.destination);musicInit();let sm=0;try{sm=localStorage.getItem('b24mute')=='1'}catch(e){}if(sm)setMute(true)}catch(e){}
 B.classList.add('started');
 $('start').classList.add('off');setTimeout(drop,500)},{once:true});
})();
</script>
</body>
